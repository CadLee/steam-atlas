# Local databases for the milestone 1 prototype.
# FastAPI and ONNX Runtime run on the host, not in these containers.
# Published ports are bound to loopback.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: steam
      POSTGRES_PASSWORD: steam
      POSTGRES_DB: steam_atlas
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  qdrant:
    image: qdrant/qdrant:v1.20.2
    environment:
      QDRANT__SERVICE__HOST: 0.0.0.0
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant:/qdrant/storage
volumes:
  pgdata: {}
  qdrant: {}
